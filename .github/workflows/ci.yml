name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm ci --prefix projects/backend

      - name: Lint backend
        run: npm run lint --prefix projects/backend

      - name: Typecheck backend
        run: npm run typecheck --prefix projects/backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Analyze frontend (conditional)
        run: |
          if [ -f projects/frontend/pubspec.yaml ]; then
            cd projects/frontend
            flutter pub get
            flutter format --set-exit-if-changed .
            flutter analyze
          else
            echo "projects/frontend/pubspec.yaml not found - skipping frontend analyze (project not initialized yet)."
          fi
