<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle Core Chat</title>
    <!-- Подключение CSS файла для стилизации чата -->
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="chat-container">
        <h1>Oracle Core AI Ассистент</h1>
        <div class="chat-messages" id="chat-messages">
            <!-- Сообщения чата будут добавляться сюда динамически -->
        </div>
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Введите ваше сообщение...">
            <button id="send-button">Отправить</button>
        </div>
    </div>

    <!-- Подключение JavaScript файла для логики чата -->
    <script src="static/script.js"></script>
</body>
</html>
